name: release

# Two entry points, one job. A human pushes a tag; the pricewatch job calls this
# workflow directly, because a tag pushed with GITHUB_TOKEN does not trigger
# workflows and the push entry point would never fire for it.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and publish.
        required: true
        type: string

permissions:
  contents: write # required to create the Release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # `make xbuild` stamps the binary via `git describe --tags`. The default
          # shallow checkout carries no tag history, so describe would fall back
          # to "dev" and we would publish binaries that misreport their version.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Single `go` directive, no `toolchain` line, for the reason spelled
          # out in ci.yml: setup-go reads only the directive.
          go-version-file: go.mod
      - run: make test
      - run: make xbuild

      # Publishing a mis-stamped binary is worse than not publishing: fail here,
      # while the Release does not exist yet and the tag can simply be moved.
      - name: Check the binaries are stamped with this tag
        run: |
          got=$(./dist/breaker-linux-amd64 version)
          echo "$got"
          case "$got" in
            *"$TAG"*) ;;
            *) echo "::error::binaries report '$got', expected $TAG"; exit 1 ;;
          esac

      - name: Publish the GitHub Release
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
